# Chopshop: configuración local de ejemplo (TODOS los datos son FALSOS).
#
# Cópiala a ~/.config/chopshop/config.toml (o apunta a otra con la variable CHOPSHOP_CONFIG) y edítala.
# Ese archivo es local y NO se versiona: aquí van tus hosts, IPs, usuarios y proyectos reales.
# Las URLs de webhook NUNCA van en este archivo: solo rutas a archivos (permisos 0600) que contienen la URL.
#
# Precedencia (menor a mayor): valores por defecto genéricos < este archivo < variables de entorno.
# Variable de entorno: CHOPSHOP_<SECCION>__<CLAVE>, p. ej. CHOPSHOP_AGENT__PORT=3791
# o CHOPSHOP_HOSTS__HOST_B__CAP=6 (doble guion bajo separa niveles; el guion de un nombre se escribe "_").
# Listas en el entorno: JSON, p. ej. CHOPSHOP_AGENT__ALLOWED_LOGINS='["otro@"]'.

[general]
home = "~/.chopshop"          # estado local: perfiles, lotes, eventos (CHOPSHOP_HOME tiene prioridad)
default_host = "host-a"       # host de T3 por defecto de los perfiles (debe existir en [hosts.*])
overflow_host = "host-b"      # donde se desbordan los lotes más grandes que el tope del host (vacío = no hay)

# Hosts de T3. Si defines al menos uno, REEMPLAZAN al host genérico "local" (no se mezclan).
# Chopshop habla con el MCP HTTP de T3 con su cliente nativo (stdlib). Se autentica solo: pide un código de pairing
# de un solo uso a `t3_bin` (`t3 auth pairing create`, siempre EN LOCAL), hace OAuth+PKCE y cachea el token en
# <CHOPSHOP_HOME>/t3-credential.json (0600). El token nunca se imprime ni va en la config.
# Claves viejas (transport, node, helper, fleet_host, general.fleet_bin) se ignoran sin error.
[hosts.host-a]
origin = ""                   # vacío = el T3 de esta máquina (origen leído de ~/.t3/userdata/server-runtime.json)
cap = 2                       # máximo de hilos en paralelo
purpose = "dev"
t3_bin = "t3"                 # CLI de T3 que emite el pairing local
access = "approval-required"  # nivel de acceso pedido a T3
credential_file = ""          # vacío = <CHOPSHOP_HOME>/t3-credential.json

[hosts.host-b]
origin = "http://100.64.0.11:3773"   # URL base del MCP de T3 de otra máquina (IP de Tailscale + puerto de T3)
cap = 4
purpose = "tests-only"        # solo tests: sin dev servers ni deploys
access = "approval-required"
credential_file = "~/.chopshop/t3-credential-host-b.json"   # caché aparte por host (opcional)

# La app de macOS: cliente puro de la API del agente (no ejecuta nada local). Ver docs/mac-build.md.
[app]
agent_url = "http://100.64.0.10:3790"     # URL del chopshop-agent (IP de Tailscale + puerto del agente)
# Sin token_file: la app se empareja con cada agente (`chopshop pair create` + Ajustes… → Emparejar) y guarda la credencial
# de dispositivo en el Keychain. Un token_file viejo aquí se ignora.
refresh_seconds = 3                       # segundos entre sondeos de /snapshot (1-300)

# Más máquinas (opcional): una tabla por agente; la app combina todas en una sola vista.
# Env: CHOPSHOP_APP__AGENTS__HOST_B__URL
[app.agents.host-b]
url = "http://100.64.0.11:3790"

# El agente (chopshop-agent), uno por máquina.
[agent]
machine_id = "host-b"                     # vacío = nombre de host de la máquina
bind = "127.0.0.1"                        # solo local por defecto. Para otras máquinas: "auto" (IP de Tailscale) o una IP concreta,
                                          # p. ej. "100.64.0.10". Nunca 0.0.0.0 ni "::" (el agente se niega a arrancar).
port = 3790
auth = "tailscale+token"                  # "tailscale+token": identidad Tailscale + credencial en toda petición (salvo
                                          # GET /health y POST /pair): la de un dispositivo emparejado (`chopshop pair create`
                                          # + POST /pair, ver docs/agent-api.md) o el bearer legado de token_file (CLI y bots)
                                          # | "token": solo bearer | "none-local": nada de red, solo el origen local
trust_local = true                        # el origen local (CLI de esta máquina) no necesita identidad ni bearer
local_listener = true                     # si bind no es loopback, escucha además en 127.0.0.1:<port> para el CLI local
tailscale_bin = "tailscale"               # CLI de Tailscale (para `whois` y bind = "auto")
owner_login = "usuario@"                  # login Tailscale COMPLETO con permiso total (como lo muestra `tailscale whois`);
                                          # esto es un marcador. Vacío = solo origen local
allowed_logins = ["invitado@"]            # logins con acceso de solo lectura (mismo formato)
allowed_hosts = []                        # nombres extra válidos en la cabecera Host (anti DNS-rebinding). Ya se aceptan las IPs
                                          # de escucha, loopback, localhost, machine_id y el hostname; añade aquí el nombre
                                          # MagicDNS completo si los clientes lo usan
t3_enabled = true                         # false = máquina solo sensor: no se vigila T3
import_legacy = true                      # importa <home>/events.jsonl del motor viejo (al arrancar y cada legacy_interval s)
legacy_interval = 5                       # segundos entre importaciones de events.jsonl (CLI externa)
engine_enabled = true                     # correr engine.tick dentro del agente cuando hay lotes en <home>/state.json
engine_interval = 5                       # segundos entre pasadas del motor
token_file = "~/.chopshop/agent/token"    # bearer legado (0600) para la CLI y bots; se crea con `chopshop agent token`.
                                          # La app de Mac usa en su lugar una credencial de dispositivo (`chopshop pair create`)
db_path = "~/.chopshop/agent/agent.db"
sample_interval = 10                      # segundos entre muestras de métricas
t3_poll_interval = 5                      # segundos entre sondeos de T3
projects_root = "~/projects"              # <projects_root>/<proyecto>
worktrees_root = "~/.t3/worktrees"        # <worktrees_root>/<proyecto>/<worktree>

# Cómo hablar con el servidor T3 de ESTA máquina.
[agent.t3]
origin = ""                               # vacío = origen del archivo runtime de T3 de esta máquina
t3_bin = "t3"                             # CLI de T3 (pairing local para el flujo OAuth+PKCE)
access = "full-access"
credential_file = ""                      # vacío = <CHOPSHOP_HOME>/t3-credential.json (0600)

# Proyectos conocidos por el agente: nombre -> raíz, worktrees e id de T3 (para atribuir métricas e hilos).
[agent.projects.proyecto-demo]
root = "~/projects/proyecto-demo"
worktrees = "~/.t3/worktrees/proyecto-demo"
t3_project_id = "00000000-0000-0000-0000-000000000000"
repo = "dueño/proyecto-demo"              # opcional: repo de GitHub del proyecto (para los eventos github.*)

# Webhooks: nombre -> RUTA a un archivo (0600) cuyo contenido es la URL. Nunca pongas la URL aquí.
[agent.webhook_files]
bot = "~/.config/chopshop/webhooks/bot.url"

# Automatizaciones por proyecto (bloque `automations:` del perfil; ver docs/automations.md).
[agent.automations]
enabled = true                            # interruptor global: false = el hilo `automations` no ejecuta nada
interval = 2                              # s entre pasadas (sobres nuevos del bus + horarios)

# Ingreso de GitHub por polling con ETag (eventos github.*; ver docs/agent-service.md). Usa el `gh` ya autenticado de esta
# máquina (`gh auth login`); el token nunca va aquí ni se lee. El proyecto de cada repo sale de `repo` en el perfil
# (~/.chopshop/profiles/<proyecto>.yaml) o de `repo` en [agent.projects.<proyecto>].
[agent.github]
enabled = false                           # true = hilo `github` del agente
repos = ["dueño/repo"]                    # repos a vigilar ("dueño/repo"); esto es un marcador
interval_s = 45                           # segundos entre pasadas (GitHub puede pedir más con X-Poll-Interval)
gh_bin = "gh"                             # CLI de GitHub
ci = true                                 # mirar check-runs del HEAD de los PRs abiertos (github.ci.completed)
actions = true                            # rack de la sala de máquinas: runs de Actions (forge.run.state / forge.repo.state)

# Retención del historial de métricas y de eventos.
[agent.retention]
raw_hours = 24
m1_days = 30
h1_days = 365
events_days = 90                          # eventos (y sus entregas) más viejos que esto se borran

# Unidad systemd --user (`chopshop agent print-unit`).
[agent.service]
read_write_paths = []                     # rutas extra de escritura (ProtectSystem=strict); ya incluye home, db_path y general.home
