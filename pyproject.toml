[project]
name = "chopshop-dev"
version = "0.9.0"
requires-python = ">=3.9"

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 160
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "ERA"]
ignore = ["E501", "E702", "E731", "E741", "B904"]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "apps/agent/chopshop", "apps/agent/tools", "apps/mac/release", "apps/mac/native/tools", "tools", "examples"]
mypy_path = "apps/agent"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
