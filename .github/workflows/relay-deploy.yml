name: Relay deploy

on:
  push:
    tags: ["relay-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Instalar dependencias, validar tipos y tests
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @chopshop/relay...
          pnpm --filter @chopshop/relay run check
          pnpm --filter @chopshop/relay run test

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          RELAY_OPERATOR_TOKEN: ${{ secrets.RELAY_OPERATOR_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/relay
          packageManager: pnpm
          secrets: |
            RELAY_OPERATOR_TOKEN
          command: deploy
