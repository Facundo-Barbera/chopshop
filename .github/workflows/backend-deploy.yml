name: Backend deploy

on:
  push:
    branches: [deploy-live]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe DEPLOY para desplegar chopshop-api"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exigir confirmación
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "confirm debe valer DEPLOY" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exigir database_id real
        run: |
          set -euo pipefail
          if grep -q '^database_id = "<' apps/backend/wrangler.toml; then
            echo "apps/backend/wrangler.toml todavía tiene el marcador de database_id" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Instalar dependencias, validar tipos, tests y build de la web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @chopshop/backend... --filter @chopshop/web-admin...
          pnpm --filter @chopshop/backend run check
          pnpm --filter @chopshop/backend run test
          pnpm --filter @chopshop/web-admin run check
          pnpm --filter @chopshop/web-admin run test
          pnpm --filter @chopshop/web-admin run build

      - name: Desplegar Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          RELAY_OPERATOR_TOKEN: ${{ secrets.RELAY_OPERATOR_TOKEN }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          packageManager: pnpm
          secrets: |
            RELAY_OPERATOR_TOKEN
            PASSWORD_PEPPER
          command: deploy
