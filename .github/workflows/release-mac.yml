name: Release Mac

# Publica Chopshop.app firmada (Developer ID), notarizada y con auto-actualización (Sparkle) en Cloudflare R2.
# Guía completa, lista de secrets/variables y rollback: docs/release.md
#
#   git tag v1.2.3 && git push origin v1.2.3        # release real (v1.2.3-beta.1 -> canal beta)
#   Actions -> Release Mac -> Run workflow           # dry-run por defecto: build + firma ad-hoc, sin credenciales
#
# Seguridad:
#  - Solo se dispara por tag o a mano; NO hay pull_request ni pull_request_target (los forks no ven secretos).
#  - Una release real exige un tag vX.Y.Z alcanzable desde la rama de releases (RELEASE_BRANCH, por defecto main).
#  - Secrets y variables a nivel de REPOSITORIO (así el job `preflight` ve cuáles faltan y falla el primero, antes de
#    tocar keychain o red). Los secrets solo se pasan como valor a los pasos que los usan; `preflight` recibe
#    únicamente un indicador "existe/no existe". El job `publish` usa el environment `release` (aprobación manual
#    opcional; no necesita secrets propios).
#  - Toda release REAL sale firmada con Developer ID y notarizada: no hay canal sin firmar y el workflow aborta si falta.
#  - DRY-RUN (workflow_dispatch con dry_run=true, el valor por defecto): omite firma Developer ID, notarización y
#    stapling (y no exige MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD ni SIGNING_IDENTITY). Compila, ensambla (firma
#    ad-hoc), zip, DMG sin firmar, firma EdDSA de Sparkle, generate_appcast y sube SOLO a R2 bajo test/<run_id>/ (el
#    DMG solo como artefacto del run). No toca el appcast ni los zips de producción, no crea GitHub Release ni tags.
#  - El DMG (instalación manual) se firma, notariza y grapa en cada release real y va a la GitHub Release junto al zip;
#    Sparkle sigue usando solo el zip y el appcast no lo referencia.
#  - Acciones fijadas por SHA de commit (comentario = versión).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: firma ad-hoc, sin notarizar; sube solo a R2 bajo test/<run_id>/ y no crea release. Desmarca solo ejecutando desde un tag vX.Y.Z"
        type: boolean
        default: true
      draft_release:
        description: "Crear la GitHub Release como borrador"
        type: boolean
        default: false
      min_macos_version:
        description: "macOS mínimo declarado (LSMinimumSystemVersion y sparkle:minimumSystemVersion)"
        type: string
        default: "13.0"

permissions:
  contents: read

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

# Valores por defecto del pipeline (sin secretos). Se editan aquí, no son variables de GitHub.
env:
  MIN_MACOS_VERSION: ${{ inputs.min_macos_version || '13.0' }}
  RELEASE_BRANCH: main # rama a la que debe pertenecer el tag
  UNIVERSAL: "1" # arm64 + x86_64 (0 = solo arm64)
  SPARKLE_AUTO_UPDATE: "false" # SUAutomaticallyUpdate
  SPARKLE_CHECK_INTERVAL: "86400" # SUScheduledCheckInterval (segundos, >= 3600)
  MAX_DELTAS: "3"
  MAX_VERSIONS: "5" # versiones que conserva el feed (los zips nunca se borran)
  DELTA_COMPRESSION: lzma
  PHASED_ROLLOUT_INTERVAL: "" # segundos entre tandas del rollout gradual (solo canal estable); vacío = sin rollout
  FULL_RELEASE_NOTES_URL: ""
  XCODE_VERSION: "" # vacío = Xcode por defecto del runner; p. ej. 16.4 fija /Applications/Xcode_16.4.app

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.short_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Modo (release real o dry-run)
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then dry=false; else dry="$DRY_INPUT"; fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "Modo: dry_run=$dry"

      # PRIMERA comprobación: lista TODOS los secrets/vars que falten (solo nombres). Los secrets se pasan como
      # indicador (`set` o vacío): este job nunca recibe su valor.
      - name: Secrets y variables requeridos
        env:
          PREFLIGHT_MODE: ${{ steps.mode.outputs.dry_run == 'true' && 'dryrun' || 'release' }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && 'set' || '' }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD != '' && 'set' || '' }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD != '' && 'set' || '' }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' && 'set' || '' }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' && 'set' || '' }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID != '' && 'set' || '' }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' && 'set' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'set' || '' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' && 'set' || '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}
        run: bash apps/mac/release/preflight.sh release

      # Ancestría y no igualdad: se puede etiquetar un commit antiguo de la rama, pero no una rama sin revisar.
      - name: El tag debe estar en la rama de releases
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) no es ancestro de origin/${RELEASE_BRANCH}: las releases salen de esa rama."
            exit 1
          fi

      - name: Versión, canal y número de build
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          flag=()
          if [ "$DRY_RUN" = "true" ]; then flag=(--dry-run); fi
          bash apps/mac/release/version.sh --ref-type "$REF_TYPE" --ref-name "$REF_NAME" ${flag[@]+"${flag[@]}"}

  build:
    name: Build, firma y notarización
    needs: preflight
    # runner fijado (no *-latest): las builds de release deben ser reproducibles entre ejecuciones
    runs-on: macos-15
    timeout-minutes: 75
    env:
      DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Seleccionar Xcode
        run: |
          set -euo pipefail
          if [ -n "${XCODE_VERSION:-}" ]; then
            dir="/Applications/Xcode_${XCODE_VERSION}.app"
            if [ ! -d "$dir" ]; then echo "::error::Xcode ${XCODE_VERSION} no existe en el runner (se busca /Applications/Xcode_<versión>.app)"; exit 1; fi
            sudo xcode-select -s "$dir/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Construir la UI (pnpm)
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @chopshop/ui run build
          test -f apps/mac/Resources/web/index.html
          test -f apps/mac/Resources/web/app.js

      - name: Keychain temporal con el certificado Developer ID
        if: env.DRY_RUN != 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash apps/mac/release/keychain.sh setup

      - name: Ensamblar Chopshop.app (con Sparkle)
        env:
          SHORT_VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
          RELEASE_MODE: ${{ env.DRY_RUN == 'true' && 'dryrun' || 'release' }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.chopshop' }}
          # En dry-run la app apunta al feed de PRUEBA (test/<run_id>), no al de producción
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}${{ env.DRY_RUN == 'true' && format('/test/{0}', github.run_id) || '' }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          APP_OUT: ${{ runner.temp }}/out/Chopshop.app
        run: bash apps/mac/release/assemble-app.sh

      - name: Firmar (hardened runtime, de dentro hacia fuera)
        env:
          # En dry-run no hay certificado: firma ad-hoc ("-"). En release, SIGN_IDENTITY (hash) lo exportó keychain.sh.
          SIGN_IDENTITY: ${{ env.DRY_RUN == 'true' && '-' || env.SIGN_IDENTITY }}
          RELEASE_MODE: ${{ env.DRY_RUN == 'true' && 'dryrun' || 'release' }} # en release, sign-app.sh rechaza la firma ad-hoc
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash apps/mac/release/sign-app.sh "$RUNNER_TEMP/out/Chopshop.app"

      - name: Notarizar, grapar y verificar
        if: env.DRY_RUN != 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash apps/mac/release/notarize.sh "$RUNNER_TEMP/out/Chopshop.app" "$RUNNER_TEMP/notarize-submit.zip"

      # El zip FINAL se crea DESPUÉS de grapar el ticket
      - name: Zip final y checksum
        id: pack
        env:
          REQUIRE_STAPLE: ${{ env.DRY_RUN == 'true' && '0' || '1' }}
        run: bash apps/mac/release/package.sh "$RUNNER_TEMP/out/Chopshop.app" "$RUNNER_TEMP/dist/Chopshop-${VERSION}.zip"

      # DMG con la app YA firmada y grapada. En dry-run queda sin firmar (y no se sube a producción).
      - name: Crear el DMG
        env:
          REQUIRE_STAPLE: ${{ env.DRY_RUN == 'true' && '0' || '1' }}
        run: bash apps/mac/release/make-dmg.sh "$RUNNER_TEMP/out/Chopshop.app" "$RUNNER_TEMP/dist/Chopshop-${VERSION}.dmg"

      - name: Firmar el DMG (Developer ID)
        if: env.DRY_RUN != 'true'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash apps/mac/release/sign-dmg.sh "$RUNNER_TEMP/dist/Chopshop-${VERSION}.dmg"

      - name: Notarizar, grapar y verificar el DMG
        if: env.DRY_RUN != 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash apps/mac/release/notarize.sh "$RUNNER_TEMP/dist/Chopshop-${VERSION}.dmg"

      - name: Subir el zip y el DMG como artefacto del run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chopshop-mac-${{ needs.preflight.outputs.version }}
          path: |
            ${{ runner.temp }}/dist/Chopshop-${{ needs.preflight.outputs.version }}.zip
            ${{ runner.temp }}/dist/Chopshop-${{ needs.preflight.outputs.version }}.zip.sha256
            ${{ runner.temp }}/dist/Chopshop-${{ needs.preflight.outputs.version }}.dmg
            ${{ runner.temp }}/dist/Chopshop-${{ needs.preflight.outputs.version }}.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ env.DRY_RUN == 'true' && 3 || 30 }}

      # Siempre, falle o no el job: borra keychain y credenciales temporales
      - name: Limpiar keychain y credenciales
        if: always()
        run: bash apps/mac/release/keychain.sh cleanup

  publish:
    name: Publicar en R2 (test/ en dry-run) y GitHub Release
    needs: [preflight, build]
    runs-on: macos-15
    timeout-minutes: 45
    # Aprobación manual opcional (Settings -> Environments -> release -> Required reviewers). Sin secrets propios.
    environment: release
    permissions:
      contents: write # crear la GitHub Release (solo en release real)
    # Un solo publicador a la vez (compartido con rollback-mac): dos releases no pisan el appcast
    concurrency:
      group: mac-updates-feed
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      # Dry-run: todo bajo test/<run_id> y con la salvaguarda R2_TEST_ONLY (r2.sh se niega a escribir fuera de test/)
      R2_PREFIX: ${{ needs.preflight.outputs.dry_run == 'true' && format('test/{0}', github.run_id) || '' }}
      R2_TEST_ONLY: ${{ needs.preflight.outputs.dry_run == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true # notas: el mensaje del tag anotado y el tag anterior
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chopshop-mac-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/dl

      # Release real: sin firma Developer ID + notarización el workflow ABORTA aquí; nunca se publica algo sin firmar.
      - name: Comprobar el zip descargado (checksum y firma)
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dl"
          shasum -a 256 -c "Chopshop-${VERSION}.zip.sha256"
          shasum -a 256 -c "Chopshop-${VERSION}.dmg.sha256"
          check="$(mktemp -d)"
          ditto -x -k "Chopshop-${VERSION}.zip" "$check"
          codesign --verify --deep --strict --verbose=2 "$check/Chopshop.app"
          if [ "$DRY_RUN" != "true" ]; then
            if ! codesign -d --verbose=2 "$check/Chopshop.app" 2>&1 | grep -x "TeamIdentifier=${APPLE_TEAM_ID}" >/dev/null; then
              echo "::error::la app no está firmada con Developer ID del equipo APPLE_TEAM_ID: no se publica una release sin firma"
              exit 1
            fi
            xcrun stapler validate "$check/Chopshop.app"
            spctl --assess --type execute -vv "$check/Chopshop.app" 2>&1 | sed 's/^origin=.*/origin=<oculto>/'
            # el DMG que se adjunta a la GitHub Release: firmado, aceptado por Gatekeeper y con el ticket grapado
            codesign --verify --strict --verbose=2 "Chopshop-${VERSION}.dmg"
            spctl -a -t open --context context:primary-signature -vv "Chopshop-${VERSION}.dmg" 2>&1 | sed 's/^origin=.*/origin=<oculto>/'
            xcrun stapler validate "Chopshop-${VERSION}.dmg"
          fi
          rm -rf "$check"

      - name: Instalar herramientas de Sparkle (versión y checksum fijados)
        run: bash apps/mac/release/sparkle-tools.sh install "$RUNNER_TEMP/sparkle"

      - name: Asegurar aws CLI
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then brew install awscli; fi
          aws --version

      - name: Huella del appcast de producción (antes)
        if: env.DRY_RUN == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: bash apps/mac/release/r2.sh prod-snapshot "$RUNNER_TEMP/prod-appcast.before"

      - name: Publicar (zips, deltas y notas primero; appcast al final)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}${{ needs.preflight.outputs.dry_run == 'true' && format('/test/{0}', github.run_id) || '' }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          NOTES_MD_OUT: ${{ runner.temp }}/release-notes.md
        run: bash apps/mac/release/publish.sh "$RUNNER_TEMP/dl/Chopshop-${VERSION}.zip"

      - name: Comprobar el objeto de prueba y que producción no se tocó
        if: env.DRY_RUN == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "Objetos bajo test/${GITHUB_RUN_ID}/:"
          bash apps/mac/release/r2.sh ls "test/${GITHUB_RUN_ID}/" | tee "$RUNNER_TEMP/test-objects.txt"
          grep -q "test/${GITHUB_RUN_ID}/appcast.xml" "$RUNNER_TEMP/test-objects.txt"
          grep -q "test/${GITHUB_RUN_ID}/Chopshop-${VERSION}.zip" "$RUNNER_TEMP/test-objects.txt"
          bash apps/mac/release/r2.sh prod-assert-unchanged "$RUNNER_TEMP/prod-appcast.before"

      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft_release }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/dl/Chopshop-${VERSION}.zip"
          dmg="$RUNNER_TEMP/dl/Chopshop-${VERSION}.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$zip.sha256" "$dmg" "$dmg.sha256" --clobber
          else
            flags=()
            if [ -n "$CHANNEL" ]; then flags+=(--prerelease); fi
            if [ "${DRAFT:-false}" = "true" ]; then flags+=(--draft); fi
            gh release create "$TAG" "$zip" "$zip.sha256" "$dmg" "$dmg.sha256" --verify-tag --title "Chopshop ${VERSION}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" ${flags[@]+"${flags[@]}"}
          fi

      # Siempre: la clave de Sparkle solo existe como archivo temporal 0600 dentro de appcast.sh; si algo la dejó, se borra
      - name: Borrar claves temporales
        if: always()
        run: rm -f "$RUNNER_TEMP"/chopshop-sparkle-key-* "$RUNNER_TEMP"/chopshop-notary-*
