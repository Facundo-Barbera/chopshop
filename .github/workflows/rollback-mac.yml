name: Rollback Mac

# Retira UNA versión del feed de Sparkle (appcast) sin tocar las demás. Los archivos de esa versión (zip y deltas)
# se mueven a retired/ en el bucket (nunca se borran: son reversibles y los deltas de otras versiones no dependen
# de ellos). Quienes YA instalaron la versión retirada no retroceden: Sparkle solo avanza; para ellos publica un
# release corregido con un número mayor. Guía: docs/release.md ("Rollback").
#
# Por defecto dry-run: regenera y valida el feed sin publicar nada.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a retirar, sin la v (p. ej. 1.2.3 o 1.3.0-beta.2)"
        required: true
        type: string
      dry_run:
        description: "Dry-run: regenera y valida el feed, no publica"
        type: boolean
        default: true
      keep_files:
        description: "No mover el zip y los deltas a retired/ (solo sacar la versión del feed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rollback-mac
  cancel-in-progress: false

jobs:
  guard:
    name: Solo desde la rama de releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Comprobar la rama
        env:
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::El rollback ejecuta los scripts de la rama elegida: lánzalo desde ${RELEASE_BRANCH} (ref actual: ${GITHUB_REF})."
            exit 1
          fi

  rollback:
    name: Retirar versión del feed
    needs: guard
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    # El mismo grupo que la publicación: release y rollback nunca escriben el appcast a la vez
    concurrency:
      group: mac-updates-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Secrets de publicación
        env:
          PREFLIGHT_MODE: release
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: bash apps/mac/release/preflight.sh publish

      - name: Instalar herramientas de Sparkle (versión y checksum fijados)
        run: bash apps/mac/release/sparkle-tools.sh install "$RUNNER_TEMP/sparkle"

      - name: Asegurar aws CLI
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then brew install awscli; fi
          aws --version

      - name: Rollback
        env:
          VERSION_TO_RETIRE: ${{ inputs.version }}
          ROLLBACK_DRY_RUN: ${{ inputs.dry_run }}
          KEEP_FILES: ${{ inputs.keep_files }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_SIGNING_PUBLIC_ED_KEY: ${{ vars.SPARKLE_SIGNING_PUBLIC_ED_KEY }}
          MIN_MACOS_VERSION: ${{ vars.MIN_MACOS_VERSION || '13.0' }}
          MAX_DELTAS: ${{ vars.MAX_DELTAS || '3' }}
          MAX_VERSIONS: ${{ vars.MAX_VERSIONS || '5' }}
          DELTA_COMPRESSION: ${{ vars.DELTA_COMPRESSION || 'lzma' }}
        run: bash apps/mac/release/rollback.sh "$VERSION_TO_RETIRE"
