name: Rollback Mac

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a retirar, sin la v (p. ej. 1.2.3 o 1.3.0-beta.2)"
        required: true
        type: string
      dry_run:
        description: "Dry-run: regenera y valida el feed, no publica"
        type: boolean
        default: true
      keep_files:
        description: "No mover el zip y los deltas a retired/ (solo sacar la versión del feed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rollback-mac
  cancel-in-progress: false

env:
  MIN_MACOS_VERSION: "13.0"
  RELEASE_BRANCH: main
  MAX_DELTAS: "3"
  MAX_VERSIONS: "5"
  DELTA_COMPRESSION: lzma

jobs:
  guard:
    name: Preflight (rama y secrets/vars)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Comprobar la rama
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]; then
            echo "::error::El rollback ejecuta los scripts de la rama elegida: lánzalo desde ${RELEASE_BRANCH} (ref actual: ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Secrets y variables requeridos
        env:
          PREFLIGHT_MODE: release
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' && 'set' || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'set' || '' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' && 'set' || '' }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}
        run: bash apps/mac/release/preflight.sh rollback

  rollback:
    name: Retirar versión del feed
    needs: guard
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    concurrency:
      group: mac-updates-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Instalar herramientas de Sparkle (versión y checksum fijados)
        run: bash apps/mac/release/sparkle-tools.sh install "$RUNNER_TEMP/sparkle"

      - name: Asegurar aws CLI
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then brew install awscli; fi
          aws --version

      - name: Rollback
        env:
          VERSION_TO_RETIRE: ${{ inputs.version }}
          ROLLBACK_DRY_RUN: ${{ inputs.dry_run }}
          KEEP_FILES: ${{ inputs.keep_files }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          UPDATES_BASE_URL: ${{ vars.UPDATES_BASE_URL }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: bash apps/mac/release/rollback.sh "$VERSION_TO_RETIRE"
